<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17161b" media="(prefers-color-scheme: dark)">
  <title data-i18n="login_doc_title">Vagas — Entrar</title>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icon-192.png">
  <script src="/static/i18n.js?v={{ asset_version }}"></script>
  <script src="/static/theme.js?v={{ asset_version }}"></script>
</head>
<body>
  <button type="button" class="lang-btn lang-btn-corner" data-lang-toggle aria-label="English">EN</button>
  <main class="login-wrap">
    <div class="login-card">
      <div class="login-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="7" width="19" height="13.5" rx="2.5"/>
          <path d="M8.5 7V5.6A2.1 2.1 0 0 1 10.6 3.5h2.8a2.1 2.1 0 0 1 2.1 2.1V7"/>
          <path d="M2.5 12.6h19"/>
        </svg>
      </div>

      <h1>Vagas</h1>
      <p data-i18n="login_tagline">Digite a senha para acessar o painel.</p>

      {% if error %}
      <p class="error" data-i18n="login_wrong_password">Senha incorreta.</p>
      {% endif %}

      <form method="post" action="/login">
        <label class="visually-hidden" for="password" data-i18n="login_password">Senha</label>
        <input type="password" id="password" name="password" placeholder="Senha"
               data-i18n-placeholder="login_password"
               autocomplete="current-password" required autofocus>
        <button type="submit" class="btn primary" data-i18n="login_submit">Entrar</button>
      </form>
    </div>
  </main>
</body>
</html>
