<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Vagas — LinkedIn bridge · Opções</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 15px/1.5 system-ui, -apple-system, sans-serif;
      max-width: 560px;
      margin: 32px auto;
      padding: 0 16px;
      color: #1c1917;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #e7e5e4; }
    }
    h1 { font-size: 20px; margin: 0 0 6px; }
    .hint { color: #78716c; font-size: 13px; margin: 4px 0 12px; }
    @media (prefers-color-scheme: dark) { .hint { color: #a8a29e; } }
    label { display: block; margin: 14px 0; font-weight: 600; }
    label > span { display: block; margin-bottom: 4px; }
    input[type="text"], input[type="url"], input[type="password"], select, textarea {
      width: 100%; box-sizing: border-box;
      padding: 8px 10px; margin-top: 4px;
      font: inherit; border: 1px solid #d6d3d1; border-radius: 8px;
      background: #fff; color: #1c1917;
    }
    @media (prefers-color-scheme: dark) {
      input, select, textarea { background: #292524; color: #e7e5e4; border-color: #57534e; }
    }
    code { background: #f5f5f4; padding: 1px 5px; border-radius: 5px; font-size: .9em; }
    @media (prefers-color-scheme: dark) { code { background: #292524; } }
    button {
      font: 600 14px system-ui, sans-serif;
      padding: 9px 16px; margin-right: 8px;
      border: 1px solid #d6d3d1; border-radius: 999px;
      background: #fafaf9; color: #1c1917; cursor: pointer;
    }
    .primary { background: #0a66c2; border-color: transparent; color: #fff; }
    #status { margin-left: 8px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Vagas — LinkedIn bridge</h1>
  <p class="hint">
    Envia as vagas que você selecionar no LinkedIn para o seu painel
    (<code>POST /api/v1/jobs:bulk</code>) e preenche o Easy Apply para você
    revisar — nunca envia a candidatura sozinho.
  </p>

  <form id="form">
    <label>
      <span>URL do painel</span>
      <input type="url" id="apiUrl" placeholder="https://vagas.av-house.com" spellcheck="false" required>
    </label>

    <label>
      <span>Chave de API (o <code>VAGAS_API_KEY</code> do servidor — fica só no seu navegador)</span>
      <input type="password" id="apiKey" placeholder="cole a chave aqui" spellcheck="false">
    </label>

    <label>
      <span>Origem das vagas (vira a "fonte" no painel)</span>
      <input type="text" id="source" placeholder="linkedin" spellcheck="false">
    </label>

    <label>
      <span>Perguntas Sim/Não sem resposta no modelo</span>
      <select id="defaultRadio">
        <option value="none">deixar em branco (recomendado)</option>
        <option value="yes">responder “Sim”</option>
        <option value="no">responder “Não”</option>
      </select>
    </label>

    <label>
      <span>Respostas do Easy Apply</span>
      <textarea id="template" rows="12" spellcheck="false"></textarea>
      <span class="hint">
        Uma por linha, no formato <b>palavra-chave,outra => resposta</b>.
        A palavra-chave bate com o rótulo da pergunta (texto normalizado). Ex.:
        <br>telefone,phone => (11) 99999-0000
        <br>autorização,authorized to work => sim
        <br>visto,visa sponsorship => não
      </span>
    </label>

    <div>
      <button type="submit" class="primary">Salvar</button>
      <button type="button" id="test">Testar conexão</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
  </form>

  <script src="options.js"></script>
</body>
</html>
