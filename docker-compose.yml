services:
  vagas:
    build: .
    container_name: vagas-app
    ports:
      - "8234:8000"
    env_file:
      - .env
    volumes:
      - vagas-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vagas-data: